
name: CorePlus Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check source files
        run: |
          find . -name "*.java"
          test -n "$(find . -path '*/src/main/java/*.java' -o -path '*/src/main/java/**/*.java' -print -quit)"

      - name: Build
        run: mvn -B clean package

      - name: Verify JAR
        run: |
          JAR=$(find . -path '*/target/*.jar' -not -name '*-sources.jar' | head -1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q "plugin.yml"
          jar tf "$JAR" | grep -q "de/coreplus/CorePlus.class"
          echo "CorePlus successfully compiled!"

      - uses: actions/upload-artifact@v4
        with:
          name: CorePlus
          path: "**/target/*.jar"
